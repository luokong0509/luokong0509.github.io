<header class="rail">
  <div class="rail-in">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="返回首页">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 4l10.4 6v12L16 28 5.6 22V10z" fill="none" stroke="#31d3c2" stroke-width="1.6"/>
        <path d="M11 16h10M16 11v10" stroke="#e8a63e" stroke-width="1.3"/>
      </svg>
      <span class="brand-txt"><b>{{ site.Params.brand }}</b><span>{{ site.Title }}</span></span>
    </a>
    <nav class="nav">
      <a href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>首页</a>
      <a href="{{ "/categories/" | relURL }}"{{ if or (eq .Kind "taxonomy") (eq .Kind "term") }} aria-current="page"{{ end }}>分类</a>
    </nav>
    <div class="clock">
      <span class="dot live" aria-hidden="true"></span>
      <span>BUS ONLINE</span>
      <span id="clock" aria-hidden="true">--:--:--</span>
    </div>
  </div>
</header>
